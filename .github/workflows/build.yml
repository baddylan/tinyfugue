name: CI

on:
  push:
    branches: [ 'main' ]
  pull_request:
    branches: [ '**' ]
  #schedule:
  #  # * is a special character in YAML so you have to quote this string
  #  - cron: '22 3 22 * *'
    
jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14', '3.15.0-rc.2']
        opts:
          - "--enable-lua"
          - "--enable-python"
          - "--disable-widechar"
          - "--enable-msdp"
    
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install packages on Linux
        run: sudo apt-get install lua5.4 liblua5.4-dev libpcre2-dev flex
      - name: Configure
        run: ./configure --enable-version --enable-symlink --enable-atcp --enable-gmcp --enable-option102 ${{ matrix.opts }}
      - name: Build
        run: make
      - name: Quote readiness regressions
        run: python3 tests/quote_readiness.py --tf src/tf -v
      - name: Install
        run: make install

  build-maxos:
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.14']
        opts:
#          - "--enable-lua"
          - "--enable-python"
          - "--disable-widechar"
          - "--enable-msdp"

    steps:
      - uses: actions/checkout@v7
      - name: Install packages on MacOS
        run: |
          brew install lua pcre2 python@${{ matrix.python-version }}
          echo "/usr/local/opt/python@${{ matrix.python-version }}/bin" >> $GITHUB_PATH
      - name: Configure
        run: ./configure --enable-version --enable-symlink --enable-atcp --enable-gmcp --enable-option102 ${{ matrix.opts }}
      - name: Build
        run: make
      - name: Install
        run: make install
